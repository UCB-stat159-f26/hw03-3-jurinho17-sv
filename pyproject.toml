[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisages"
version = "0.1.0"
description = "Fetch a tennis player's career from Tennis Abstract and plot age vs. opponent age."
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["tennisages"]
